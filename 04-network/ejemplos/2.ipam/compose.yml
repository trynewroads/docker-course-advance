x-app-base: &app-base
  build:
    context: ./../../../app
    dockerfile: ../04-volumes/ejemplos/Dockerfile
  ports:
    - "3000:3000"
  image: app-base
  container_name: app-base
  environment:
    NODE_ENV: development
    PORT: 3000

services:
  app-base-1:
    <<: *app-base
    container_name: app-base-1
    hostname: app-base-1

  app-base-2:
    <<: *app-base
    container_name: app-base-2
    hostname: app-base-2
    ports:
      - "3001:3000"

networks:
  default:
    name: compose-ipam
    ipam:
      driver: default
      config:
        - subnet: 192.168.120.0/24
          ip_range: 192.168.120.128/25
          gateway: 192.168.120.1
          aux_addresses:
            proxy: 192.168.120.20
            dns: 192.168.120.10
    driver_opts:
      com.docker.network.bridge.name: compose-ipam
      com.docker.network.bridge.enable_icc: "true"
