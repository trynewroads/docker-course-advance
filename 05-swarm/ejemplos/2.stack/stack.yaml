services:
  app-base:
    image: ghcr.io/trynewroads/docker-course-advance:latest
    hostname: app-base
    environment:
      USE_DB: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: password
      DB_NAME: postgres
    ports:
      - "3001:3000"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
      placement:
        constraints:
          - node.role == worker

  postgres:
    image: postgres:15
    hostname: postgres
    ports:
      - "5432:5432"
    deploy:
      placement:
        constraints:
          - node.role == manager
      replicas: 1
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.50"
          memory: 512M
    environment:
      POSTGRES_PASSWORD: password

networks:
  default:
    driver: overlay
    name: app-base
