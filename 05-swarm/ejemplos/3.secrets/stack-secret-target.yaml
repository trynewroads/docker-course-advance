services:
  app-base:
    hostname: app-base
    image: ghcr.io/trynewroads/docker-course-advance:latest
    environment:
      DEBUG_LEVEL: debug
      USE_DB: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_NAME: postgres
    ports:
      - "3005:3000"
    secrets:
      - source: db_password_text
        target: db_password
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker

  postgres:
    hostname: postgres
    image: postgres:15
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password_text
    secrets:
      - db_password_text
        

secrets:
  db_password_text:
    external: true

networks:
  default:
    driver: overlay
    name: app-base
