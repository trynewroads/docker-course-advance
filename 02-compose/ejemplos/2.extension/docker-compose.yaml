x-base: &base
  image: app-base
  container_name: base-1
  ports:
    - "3000:5000"
  environment:
    - PORT=5000
    - LOG_LEVEL=debug

services:
  base-1:
    <<: *base
  base-2:
    <<: *base
    container_name: base-2
    ports:
      - "4000:5000"

  base-3:
    <<: *base
    container_name: base-3
    ports:
      - "5000:5000"

  base-4:
    <<: *base
    container_name: base-4
    ports:
      - "6000:5000"
    environment:
      LOG_LEVEL: info

networks:
  default:
    driver: bridge
    name: app-base
