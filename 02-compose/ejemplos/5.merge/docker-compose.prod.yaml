services:
  app-base:
    volumes:
      - app-logs:/app/logs
      - app-uploads:/app/uploads
    environment:
      SECRET: production-secret
      DEBUG_LEVEL: warn
      USE_DB: true
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: password
      DB_NAME: postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: postgres
    image: postgres:15
    environment: &db-env
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 20s
      timeout: 10s
      retries: 3

volumes:
  app-logs:
    driver: local
  app-uploads:
    driver: local
